# Training configuration (read by train/train.py and train/utils.py).
#
# members   the full argparse namespace stored inside each shipped checkpoint (blob["cfg"]); train/train.py turns
#           an entry into the exact src/finetune.py command and checks that it re-parses to this config.
#           v12_ep4 is the v12 run (tag v12, seed 61); the shipped file is its epoch-4 snapshot.
# derived   the three members whose final weights were lost, as a stored config plus the fields that differ:
#           v12 = the same run to its last epoch, v12s62 = v12 with seed 62, v5all = v5_S trained on all of
#           validation (valall_audio in place of valtune_audio).
